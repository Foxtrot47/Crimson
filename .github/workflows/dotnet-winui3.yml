# This workflow will build, sign, and package a WinUI 3 MSIX desktop application
# built on .NET.

name: WinUI 3 MSIX app

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test portable Core
      run: dotnet test Crimson.Core.Tests/Crimson.Core.Tests.csproj --configuration Release

  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: Crimson.sln
      Configuration: ${{ matrix.configuration }}
      Platform: ${{ matrix.platform }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore Crimson.sln -r win-$env:Platform -p:Platform=$env:Platform -p:PublishReadyToRun=true

    - name: Test
      run: dotnet test Crimson.Tests\Crimson.Tests.csproj --no-restore --configuration $env:Configuration -p:Platform=$env:Platform

    # Create the app package by building and packaging the project
    - name: Create the app package
      run: dotnet publish Crimson\Crimson.csproj -r win-$env:Platform --configuration $env:Configuration -p:Platform=$env:Platform --self-contained true --no-restore
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Appx_Package_Dir: Packages/

    # Upload the build output: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Package
        path: Crimson\bin\Release\net10.0-windows10.0.22621.0\win-x64\publish
