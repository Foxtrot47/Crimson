# This workflow will build, sign, and package a WinUI 3 MSIX desktop application
# built on .NET.

name: WinUI 3 MSIX app

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: Crimson.sln
      Configuration: ${{ matrix.configuration }}
      Platform: ${{ matrix.platform }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore Crimson.sln -r win-$env:Platform -p:Platform=$env:Platform -p:PublishReadyToRun=true

    - name: Test
      run: dotnet test Crimson.Tests\Crimson.Tests.csproj --no-restore --configuration $env:Configuration -p:Platform=$env:Platform

    # Unpackaged build, for direct download
    - name: Publish unpackaged
      run: dotnet publish Crimson\Crimson.csproj -r win-$env:Platform --configuration $env:Configuration -p:Platform=$env:Platform --self-contained true --no-restore

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Package
        path: Crimson\bin\Release\net10.0-windows10.0.22621.0\win-x64\publish

    # MSIX for Store submission. Microsoft signs Store packages, so this is unsigned.
    - name: Create the MSIX package
      run: dotnet build Crimson\Crimson.csproj -r win-$env:Platform --configuration $env:Configuration -p:Platform=$env:Platform -p:EnablePackaging=true

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: msix-store-package
        path: artifacts/msix/**
        if-no-files-found: error
