name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400

      - name: Test portable core
        run: dotnet test Crimson.Core.Tests/Crimson.Core.Tests.csproj --configuration Release --nologo

  build:
    runs-on: windows-latest
    env:
      Configuration: Release
      Platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Crimson.sln -r win-$env:Platform -p:Platform=$env:Platform -p:PublishReadyToRun=true

      - name: Test
        run: dotnet test Crimson.Tests\Crimson.Tests.csproj --no-restore --configuration $env:Configuration -p:Platform=$env:Platform

      - name: Publish unpackaged
        run: dotnet publish Crimson\Crimson.csproj -r win-$env:Platform --configuration $env:Configuration -p:Platform=$env:Platform --self-contained true --no-restore

      - name: Upload unpackaged build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Crimson-win-x64
          path: Crimson\bin\Release\net10.0-windows10.0.22621.0\win-x64\publish
          if-no-files-found: error

      - name: Build unsigned Store package
        run: dotnet build Crimson\Crimson.csproj -r win-$env:Platform --configuration $env:Configuration -p:Platform=$env:Platform -p:EnablePackaging=true -p:EnableTestSigning=false

      - name: Upload Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Crimson-store-package
          path: artifacts/msix/*.msixupload
          if-no-files-found: error
