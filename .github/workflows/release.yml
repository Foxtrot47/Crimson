name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag and release commit
        id: version
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Tag '${{ github.ref_name }}' -Commit '${{ github.sha }}' -GitHubOutput $env:GITHUB_OUTPUT

  release:
    needs: validate
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MSIX_VERSION: ${{ needs.validate.outputs.msix_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400

      - name: Build and verify release assets
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: ./scripts/build-release.ps1 -Version $env:VERSION -MsixVersion $env:MSIX_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          The portable ZIP can be run without installing a certificate.

          To install the MSIX, first import Crimson-$env:VERSION.cer into the current user's Trusted People certificate store. The MSIX is a full-trust desktop application. The sideload and Microsoft Store packages share an identity and cannot be installed side by side.
          "@
          $assets = (Get-ChildItem dist -File).FullName
          gh release create '${{ github.ref_name }}' @assets --verify-tag --draft --generate-notes --title "Crimson $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
          gh release edit '${{ github.ref_name }}' --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish draft release.' }
