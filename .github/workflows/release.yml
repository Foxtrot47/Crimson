name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Releases must be dispatched from the main branch.'
          }

          [xml] $versionFile = Get-Content Directory.Build.props -Raw
          $version = [string] $versionFile.Project.PropertyGroup.Version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Directory.Build.props must contain a stable SemVer version; found '$version'."
          }

          $tag = "v$version"
          if (git tag --list $tag) {
            throw "Git tag $tag already exists. Increment the version before releasing again."
          }

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "GitHub Release $tag already exists. Increment the version before releasing again."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "msix_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Build and verify release assets
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:VERSION -MsixVersion $env:MSIX_VERSION -Unsigned
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MSIX_VERSION: ${{ steps.version.outputs.msix_version }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Crimson-${{ steps.version.outputs.tag }}-win-x64
          path: |
            dist/*.zip
            dist/*.msixupload
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create Git tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          The portable ZIP can be run without installing anything.

          The Microsoft Store package is unsigned and is normally submitted to Partner Center by Crimson itself; a `.msixupload` cannot be installed directly.

          License: GPL-3.0-or-later. Each application package includes LICENSE.txt.
          Source for this release: https://github.com/Foxtrot47/Crimson/tree/${{ steps.version.outputs.tag }}
          "@
          $assets = (Get-ChildItem dist -File).FullName
          gh release create '${{ steps.version.outputs.tag }}' @assets --target '${{ github.sha }}' --generate-notes --title "Crimson $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release.' }
