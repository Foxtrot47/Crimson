name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Releases must be dispatched from the main branch.'
          }

          [xml] $versionFile = Get-Content Directory.Build.props -Raw
          $version = [string] $versionFile.Project.PropertyGroup.Version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Directory.Build.props must contain a stable SemVer version; found '$version'."
          }

          $tag = "v$version"
          if (git tag --list $tag) {
            throw "Git tag $tag already exists. Increment the version before releasing again."
          }

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "GitHub Release $tag already exists. Increment the version before releasing again."
          }

          # The release notes are the changelog entry for this version.
          $changelog = Get-Content CHANGELOG.md -Raw
          $entry = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          if (-not $entry.Success) {
            throw "CHANGELOG.md has no '## [$version]' entry. Add the release notes before releasing."
          }
          $notes = $entry.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "The CHANGELOG.md entry for $version is empty."
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Set-Content artifacts/release-notes.md $notes -Encoding utf8

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "msix_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Build and verify release assets
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:VERSION -MsixVersion $env:MSIX_VERSION -Unsigned
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MSIX_VERSION: ${{ steps.version.outputs.msix_version }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Crimson-${{ steps.version.outputs.tag }}-win-x64
          path: |
            dist/*.zip
            dist/*.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create Git tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            "dist/Crimson-${env:VERSION}-win-x64.zip"
            "dist/Crimson-${env:VERSION}-win-x64.msix"
            'dist/SHA256SUMS.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          gh release create '${{ steps.version.outputs.tag }}' @assets --target '${{ github.sha }}' --title "Crimson $env:VERSION" --notes-file 'artifacts/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release.' }
